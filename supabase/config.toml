# Link this checkout to an environment locally with:
#   supabase link --project-ref "$SUPABASE_PROJECT_REF"
# The project ref is intentionally not stored here so development, preview,
# staging, and production cannot inherit an environment-specific ID from Git.

[api]
enabled = true

[db]
port = 54322

[auth]
enabled = true

[storage]
enabled = true

[realtime]
enabled = true
