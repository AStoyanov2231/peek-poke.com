name: Verify

on:
  pull_request:
  push:
    branches:
      - master
      - product-redesign

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  web:
    name: Web lint, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - name: Production build with fixture-only configuration
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-ci-verify
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
          SUPABASE_SERVICE_ROLE_KEY: e2e-service-role-key
          STRIPE_SECRET_KEY: sk_test_fixture_only
          STRIPE_WEBHOOK_SECRET: fixture-only
          STRIPE_PREMIUM_PRICE_ID: ""
          TURN_SHARED_SECRET: ""
          TURN_URLS: ""
          UPSTASH_REDIS_REST_URL: ""
          UPSTASH_REDIS_REST_TOKEN: ""
          KV_REST_API_URL: ""
          KV_REST_API_TOKEN: ""
          CRON_SECRET: fixture-only

  sql:
    name: Embedded SQL fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:product-db
      - run: node test/sql/legacy-sql-special-forms.mjs
      - name: Install PostgreSQL 17 for real concurrency checks
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-17
      - name: Verify actual lock waits and transaction ordering
        run: npm run test:postgres-concurrency
        env:
          POSTGRES_BIN: /usr/lib/postgresql/17/bin

  native:
    name: Native typecheck, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run native:typecheck
      - run: npm run native:lint
      - run: npm run native:test

  browser-fixtures:
    name: Playwright fixture journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      E2E_FIXTURE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve fixture screenshots for visual review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-fixture-screenshots
          path: test-results/e2e/*.png
          if-no-files-found: warn
          retention-days: 14
